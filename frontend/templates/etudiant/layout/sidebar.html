{% load static %}

<aside class="admin-sidebar">
  <div class="admin-sidebar__header">
    <div class="admin-sidebar__logo-wrapper">
      <img
        src="{% static 'images/logo.png' %}"
        alt="School Management Logo"
        class="admin-sidebar__logo-img"
      />
    </div>
    <span class="admin-sidebar__title">Portail Étudiant</span>
  </div>

  <nav class="admin-sidebar__nav">
    <div class="admin-sidebar__section">
      <span class="admin-sidebar__section-title"> PRINCIPAL </span>
      <a
        href="{% url 'etudiant_dashboard' %}"
        class="admin-sidebar__link {% if request.resolver_match.url_name == 'etudiant_dashboard' %} active {% endif %}"
      >
        <i class="fa-solid fa-chart-line"></i>
        <span>Tableau de bord</span>
      </a>
    </div>

    <div class="admin-sidebar__section">
      <span class="admin-sidebar__section-title"> MON ESPACE </span>
      <a
        href="{% url 'etudiant_profile' %}"
        class="admin-sidebar__link {% if 'profile' in request.resolver_match.url_name %} active {% endif %}"
      >
        <i class="fa-solid fa-user-circle"></i>
        <span>Mon Profil</span>
      </a>

      <a
        href="{% url 'etudiant_grades' %}"
        class="admin-sidebar__link {% if 'grades' in request.resolver_match.url_name %} active {% endif %}"
      >
        <i class="fa-solid fa-clipboard-check"></i>
        <span>Mes Notes</span>
      </a>

      <a
        href="{% url 'etudiant_results' %}"
        class="admin-sidebar__link {% if 'results' in request.resolver_match.url_name %} active {% endif %}"
      >
        <i class="fa-solid fa-file-lines"></i>
        <span>Mes Résultats</span>
      </a>

      <a
        href="{% url 'etudiant_absences' %}"
        class="admin-sidebar__link {% if 'absences' in request.resolver_match.url_name %} active {% endif %}"
      >
        <i class="fa-solid fa-calendar-xmark"></i>
        <span>Mes Absences</span>
      </a>

      <a
        href="{% url 'etudiant_subjects' %}"
        class="admin-sidebar__link {% if 'subjects' in request.resolver_match.url_name %} active {% endif %}"
      >
        <i class="fa-solid fa-book"></i>
        <span>Mes Matières</span>
      </a>

      <a
        href="{% url 'etudiant_arrieres' %}"
        class="admin-sidebar__link {% if 'arrieres' in request.resolver_match.url_name %} active {% endif %}"
      >
        <i class="fa-solid fa-wallet"></i>
        <span>Mes Arriérés</span>
      </a>
    </div>
  </nav>

  <div class="admin-sidebar__bottom">
    <form action="{% url 'logout' %}" method="POST">
      {% csrf_token %}
      <button type="submit" class="admin-sidebar__logout border-0 bg-transparent w-100 text-start">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Déconnexion</span>
      </button>
    </form>
  </div>
</aside>
